name: macOS CI
run-name: CI · ${{ github.head_ref || github.ref_name }}

on:
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: Jobs to run
        type: choice
        required: true
        default: all
        options: [all, test, build]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.job || 'all' }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script Tests
    if: github.event_name == 'pull_request' || inputs.job == 'all' || inputs.job == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Python script tests
        run: python3 -B -m unittest discover -s script/tests -v

  format:
    name: Format
    if: github.event_name == 'pull_request' || inputs.job == 'all'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.48.0'

      - name: Check Swift formatting
        run: task format:check

  build:
    name: Build
    if: github.event_name == 'pull_request' || inputs.job == 'all' || inputs.job == 'build'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          echo "MONO_DECK_DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          xcodebuild -version
          sw_vers

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.48.0'

      - name: Restore Swift packages
        id: packages
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with: &package_cache
          path: ${{ runner.temp }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-macos-26-swiftpm-${{ hashFiles('MonoDeck.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build and package arm64 app
        id: package
        env:
          MONO_DECK_PACKAGE_DIR: ${{ runner.temp }}/package
        run: task package

      - name: Save Swift packages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with: *package_cache

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.dmg_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test
    needs: scripts
    if: always() && (github.event_name == 'pull_request' || inputs.job == 'all' || inputs.job == 'test')
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Require script tests to pass
        env:
          SCRIPT_TEST_RESULT: ${{ needs.scripts.result }}
        run: test "$SCRIPT_TEST_RESULT" = success

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Python script tests on macOS
        run: python3 -B -m unittest discover -s script/tests -v

      - name: Show toolchain
        run: |
          echo "MONO_DECK_DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          xcodebuild -version
          sw_vers

      - name: Restore Swift packages
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with: *package_cache

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.48.0'

      - name: Run tests
        id: tests
        run: task test -- -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"

      - name: Upload failed test results
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14
